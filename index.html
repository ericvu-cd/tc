<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>潮汐淨灘</title>
<meta name="description" content="海浪回來之前，把沙灘清乾淨。海洋廢棄物分類小遊戲。">
<meta name="theme-color" content="#1f6e7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="潮汐淨灘">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#2a2620;
  --paper:#fbf5e6;
  --paper-2:#f1e6c9;
  --muted:#6f6554;
  --page:#0f4c55;
  --sea:#1f6e7a;
  --sea-2:#3e9ca0;
  --foam:#f4fbf8;
  --sand:#e3c88f;
  --sand-wet:#c9a66c;
  --deck:#8a6238;
  --deck-2:#6f4c29;
  --coral:#e0584a;
  --good:#2b8a6e;
  --gold:#e0a93a;
  --round:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d2a2c; --paper-2:#26383a; --ink-ui:#f1ead8; --muted:#b3ab96; --page:#071d21; --good:#6fd3b0;
  }
}
:root[data-theme="dark"]{ --paper:#1d2a2c; --paper-2:#26383a; --ink-ui:#f1ead8; --muted:#b3ab96; --page:#071d21; --good:#6fd3b0; }
*,*::before,*::after{box-sizing:inherit;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;height:100%;overflow:hidden;background:var(--page);
  font-family:var(--body);color:var(--ink-ui,var(--ink));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font:inherit;color:inherit;}
svg{display:block;width:100%;height:100%;overflow:visible;}

#app{height:100%;max-width:520px;margin:0 auto;position:relative;display:flex;flex-direction:column;background:var(--sand);overflow:hidden;}
.screen{display:none;flex:1;min-height:0;flex-direction:column;}
.screen.on{display:flex;}

/* ---------- 首頁 ---------- */
#start{background:linear-gradient(180deg,var(--sand-wet) 0,var(--sand) 90px);position:relative;}
.start-sea{height:38%;flex-shrink:0;background:linear-gradient(180deg,var(--sea) 0%,var(--sea-2) 100%);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 22px;color:var(--foam);}
.start-sea h1{font-family:var(--round);font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;margin:0;letter-spacing:.04em;}
.start-sea p{margin:10px 0 0;font-size:1rem;opacity:.92;}
.start-foam{position:absolute;left:-5%;width:110%;bottom:-11px;height:16px;animation:lap 3.2s ease-in-out infinite alternate;}
.start-body{flex:1;min-height:0;overflow-y:auto;padding:26px 24px 20px;display:flex;flex-direction:column;gap:14px;color:var(--ink);}
.rule{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;font-size:.98rem;line-height:1.5;}
.rule .pic{width:52px;height:52px;}
.rule b{font-family:var(--round);font-weight:400;font-size:1.08rem;display:block;}
.start-actions{display:flex;gap:10px;margin-top:auto;padding-top:8px;}
.btn{border:2.5px solid var(--ink);border-radius:14px;padding:13px 18px;font-family:var(--round);font-size:1.15rem;cursor:pointer;background:var(--paper);color:var(--ink-ui,var(--ink));box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.btn.primary{background:var(--coral);color:#fff;flex:1;}
.btn.install{font-size:1rem;padding:10px 14px;background:var(--foam);color:var(--ink);}
.install-tip{margin:0;font-size:.85rem;line-height:1.5;color:var(--muted);text-align:center;}
[hidden]{display:none !important;}
.btn:focus-visible,.bin:focus-visible,.item:focus-visible,.icon-btn:focus-visible,.dex-card:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--ink);}

/* ---------- 遊戲 HUD ---------- */
#game{background:var(--sand);}
.hud{background:var(--sea);color:var(--foam);padding:8px 12px 6px;display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;position:relative;z-index:5;}
.hud .where{font-family:var(--round);font-size:1.05rem;}
.hud .where small{font-family:var(--body);font-size:.8rem;opacity:.85;margin-left:6px;}
.hud .score{font-family:var(--round);font-size:1.35rem;text-align:right;line-height:1;min-width:64px;}
.hud .score small{display:block;font-family:var(--body);font-size:.68rem;opacity:.8;margin-top:2px;}
.combo{display:inline-block;background:var(--gold);color:var(--ink);font-size:.72rem;border-radius:6px;padding:1px 6px;margin-left:4px;font-family:var(--body);font-weight:700;vertical-align:middle;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:transparent;color:var(--foam);cursor:pointer;display:grid;place-items:center;padding:0;}
.icon-btn svg{width:20px;height:20px;}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr;gap:10px;}
.bar{font-size:.72rem;}
.bar .track{height:9px;border-radius:5px;background:rgba(0,0,0,.28);overflow:hidden;margin-top:3px;}
.bar .fill{height:100%;border-radius:5px;background:#8fe0c4;transition:width .35s,background .35s;}
.bar.low .fill{background:var(--coral);}
.bar.tide .fill{background:var(--foam);transition:none;}
.bar .lbl{display:flex;justify-content:space-between;opacity:.9;}

/* ---------- 沙灘 ---------- */
#field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;
  --sea-h:17%;
  background:
    radial-gradient(circle at 20% 70%,rgba(255,255,255,.18) 0 2px,transparent 3px) 0 0/37px 41px,
    radial-gradient(circle at 70% 30%,rgba(120,90,40,.16) 0 1.5px,transparent 2.5px) 0 0/29px 31px,
    linear-gradient(180deg,var(--sand-wet) 0%,var(--sand) 38%,#e8d09c 100%);
}
.sea{position:absolute;left:0;right:0;top:0;height:var(--sea-h);background:linear-gradient(180deg,var(--sea) 0%,var(--sea-2) 100%);z-index:1;}
.sea .edge{position:absolute;left:-5%;width:110%;bottom:-11px;height:16px;animation:lap 3.2s ease-in-out infinite alternate;}
@keyframes lap{from{transform:translateX(-2%);}to{transform:translateX(2%);}}
.surge{position:absolute;left:0;right:0;top:0;height:0;z-index:6;pointer-events:none;background:linear-gradient(180deg,rgba(62,156,160,.92),rgba(127,207,201,.8));}
.surge .edge{position:absolute;left:-5%;width:110%;bottom:-13px;height:18px;}
#items{position:absolute;inset:0;z-index:3;}
.item{position:absolute;width:var(--iw,78px);transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:grab;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:left .25s,top .25s,opacity .2s;}
.item .art{width:var(--ia,58px);height:var(--ia,58px);filter:drop-shadow(0 3px 0 rgba(90,60,20,.25));position:relative;}
.item .tag{margin-top:2px;font-size:.78rem;font-weight:500;background:rgba(251,245,230,.92);color:var(--ink);border-radius:7px;padding:1px 6px;white-space:nowrap;border:1.5px solid rgba(42,38,32,.25);}
.item.selected .art{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff);}
.item.selected .tag{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.item.lifted{opacity:.22;}
.item.buried{cursor:pointer;}
.item.buried .tag{background:rgba(42,38,32,.72);color:#fff;border-color:transparent;}
.item.big{--iw:118px;--ia:98px;}
.item.big.cut{--iw:86px;--ia:66px;}
.item.danger .art::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--coral);animation:pulse .7s ease-in-out infinite alternate;}
@keyframes pulse{from{transform:scale(.9);opacity:.5;}to{transform:scale(1.08);opacity:1;}}
.item.arrive{animation:arrive .5s ease-out both;}
@keyframes arrive{from{opacity:0;transform:translate(-50%,-90%) scale(.7);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.item.swept{transition:top .6s ease-in,opacity .6s ease-in;opacity:0;}
.item.dig .art{animation:dig .35s ease-out;}
@keyframes dig{0%{transform:scale(.6) translateY(10px);}70%{transform:scale(1.12);}100%{transform:scale(1);}}
.item.snip .art{animation:snip .25s;}
@keyframes snip{0%,100%{transform:rotate(0);}33%{transform:rotate(-6deg);}66%{transform:rotate(6deg);}}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:none;transition:none;margin:0;}
.ghost .art{filter:drop-shadow(0 10px 6px rgba(0,0,0,.3));}

.turtle{position:absolute;width:72px;height:72px;transform:translate(-50%,-50%);z-index:4;pointer-events:none;transition:filter .2s;}
.turtle.hurt{filter:drop-shadow(0 0 8px var(--coral)) saturate(.4);}
.turtle .wiggle{width:100%;height:100%;animation:crawl .5s ease-in-out infinite alternate;}
@keyframes crawl{from{transform:rotate(-5deg);}to{transform:rotate(5deg);}}

#toast{position:absolute;left:10px;right:10px;top:10px;z-index:8;background:var(--paper);color:var(--ink-ui,var(--ink));border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:.92rem;line-height:1.45;box-shadow:0 4px 0 rgba(42,38,32,.35);opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none;}
#toast.show{opacity:1;transform:none;}
#toast b{font-family:var(--round);font-weight:400;display:block;font-size:1rem;}
#toast.bad{border-color:var(--coral);}
#toast.bad b{color:var(--coral);}
#toast.good b{color:var(--good);}

/* ---------- 分類桶（木棧道） ---------- */
.deck{position:relative;z-index:5;background:repeating-linear-gradient(90deg,var(--deck) 0 46px,var(--deck-2) 46px 48px);border-top:3px solid var(--deck-2);padding:8px 6px 10px;}
#bins{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;}
.bin{background:none;border:0;padding:4px 0 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fbf5e6;transition:transform .12s,background .12s;}
.bin .can{width:48px;height:46px;}
.bin span{font-family:var(--round);font-size:.95rem;line-height:1.1;white-space:nowrap;}
.bin.hover,.bin.ready{background:rgba(255,255,255,.16);}
.bin.hover{transform:translateY(-4px) scale(1.06);}
.bin.bump{animation:bump .3s;}
@keyframes bump{40%{transform:scale(1.15) translateY(-3px);}}
.bin.nope{animation:nope .35s;}
@keyframes nope{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.deck .hint{font-size:.72rem;color:rgba(251,245,230,.8);text-align:center;margin-top:4px;}

.pop{position:fixed;z-index:70;pointer-events:none;font-family:var(--round);color:#fff;font-size:1.3rem;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.4);transform:translate(-50%,-100%);animation:pop .8s ease-out forwards;white-space:nowrap;text-align:center;}
.pop small{display:block;font-size:.8rem;color:var(--gold);}
.pop.minus{color:#ffd0c8;}
@keyframes pop{0%{opacity:0;margin-top:0;}20%{opacity:1;}100%{opacity:0;margin-top:-46px;}}

/* ---------- 疊層視窗 ---------- */
.overlay{position:absolute;inset:0;z-index:40;background:rgba(10,40,46,.62);display:none;align-items:center;justify-content:center;padding:18px;}
.overlay.on{display:flex;}
.card{background:var(--paper);color:var(--ink-ui,var(--ink));border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);width:100%;max-width:400px;max-height:100%;overflow-y:auto;padding:20px 20px 18px;}
.card h2{font-family:var(--round);font-weight:400;font-size:1.8rem;margin:0 0 4px;line-height:1.2;}
.card p{margin:8px 0;line-height:1.6;}
.card .sub{color:var(--muted);margin:0 0 10px;font-size:.92rem;}
.card .row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;margin:10px 0;line-height:1.5;font-size:.95rem;}
.card .row .pic{width:48px;height:48px;}
.card .note{background:var(--paper-2);border-radius:10px;padding:9px 12px;font-size:.9rem;line-height:1.55;margin:12px 0;}
.card .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.card .actions .btn{flex:1;font-size:1.05rem;padding:11px 10px;white-space:nowrap;}
.newbins{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px;}
.newbins span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:9px;padding:3px 8px 3px 4px;font-family:var(--round);font-size:.95rem;background:#fff;color:var(--ink);}
.newbins i{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink);display:inline-block;}

.big-score{font-family:var(--round);font-size:3.2rem;line-height:1;margin:6px 0 2px;}
.best{font-size:.9rem;color:var(--muted);}
.best.new{color:var(--coral);font-weight:700;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
.stats div{background:var(--paper-2);border-radius:10px;padding:8px 4px;text-align:center;}
.stats b{font-family:var(--round);font-weight:400;font-size:1.4rem;display:block;}
.stats span{font-size:.75rem;color:var(--muted);}
.breakdown{margin:10px 0;}
.breakdown .ln{display:grid;grid-template-columns:56px 1fr 28px;gap:8px;align-items:center;font-size:.85rem;margin:5px 0;}
.breakdown .ln div{height:12px;border-radius:6px;background:var(--paper-2);overflow:hidden;}
.breakdown .ln div i{display:block;height:100%;border-radius:6px;border-right:2px solid var(--ink);}
.breakdown .ln em{font-style:normal;text-align:right;font-family:var(--round);}

/* ---------- 圖鑑 ---------- */
#dex .card{max-width:480px;padding-bottom:12px;}
.dex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.dex-sec h3{font-family:var(--round);font-weight:400;font-size:1.05rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px;}
.dex-sec h3 i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;}
.dex-card{background:var(--paper-2);border:0;border-radius:10px;padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.dex-card .art{width:42px;height:42px;}
.dex-card span{font-size:.7rem;line-height:1.2;text-align:center;}
.dex-card.locked .art{filter:brightness(0);opacity:.16;}
.dex-card.locked span{color:var(--muted);}
.dex-detail{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;}
.dex-detail .art{width:96px;height:96px;}

@media (max-height:680px){
  #app{--iw:70px;--ia:50px;}
  .item .tag{font-size:.72rem;}
  .bin .can{width:40px;height:38px;}
  .bin span{font-size:.85rem;}
  .deck .hint{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;}
}
</style>
</head>
<body>
<div id="app">

  <!-- 首頁 -->
  <section class="screen on" id="start">
    <div class="start-sea">
      <h1>潮汐淨灘</h1>
      <p>海浪回來之前，把沙灘清乾淨。</p>
      <div class="start-foam" id="startFoam"></div>
    </div>
    <div class="start-body">
      <div class="rule"><div class="pic" id="rp1"></div><div><b>拖進正確的桶子</b>也可以先點物品，再點桶子。</div></div>
      <div class="rule"><div class="pic" id="rp2"></div><div><b>自然物不用撿</b>貝殼、海藻留在沙灘上，讓海浪帶走。</div></div>
      <div class="rule"><div class="pic" id="rp3"></div><div><b>保護爬過的海龜</b>別讓塑膠袋、漁繩擋在牠的路上。</div></div>
      <div class="start-actions">
        <button class="btn primary" id="startBtn">開始淨灘</button>
        <button class="btn" id="dexBtn">圖鑑 <span id="dexCount">0/70</span></button>
      </div>
      <button class="btn install" id="installBtn" hidden>安裝到手機，離線也能玩</button>
      <p class="install-tip" id="iosTip" hidden>iPhone 可以點 Safari 下方的分享按鈕，選「加入主畫面」，離線也能玩。</p>
    </div>
  </section>

  <!-- 遊戲 -->
  <section class="screen" id="game">
    <div class="hud">
      <div class="where" id="where">第一潮<small>浪 1/4</small></div>
      <div class="score"><span id="score">0</span><span id="combo"></span><small>分數</small></div>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" id="muteBtn" aria-label="關閉音效"></button>
        <button class="icon-btn" id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
      </div>
      <div class="bars">
        <div class="bar" id="hpBar"><div class="lbl"><span>海洋健康</span><span id="hpNum">100</span></div><div class="track"><div class="fill" id="hpFill" style="width:100%"></div></div></div>
        <div class="bar tide"><div class="lbl"><span>下一波浪</span><span id="tideNum"></span></div><div class="track"><div class="fill" id="tideFill" style="width:100%"></div></div></div>
      </div>
    </div>
    <div id="field">
      <div class="sea"><div class="edge" id="seaEdge"></div></div>
      <div id="items"></div>
      <div class="surge" id="surge"><div class="edge" id="surgeEdge"></div></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <div class="deck">
      <div id="bins"></div>
      <div class="hint" id="deckHint">貝殼、海藻這類自然物不用撿</div>
    </div>
  </section>

  <!-- 潮段說明 -->
  <div class="overlay" id="intro"><div class="card" id="introCard"></div></div>
  <!-- 暫停 -->
  <div class="overlay" id="pause"><div class="card">
    <h2>暫停中</h2><p class="sub">海浪也先停下來等你。</p>
    <div class="actions"><button class="btn primary" id="resumeBtn">繼續</button><button class="btn" id="quitBtn">回首頁</button></div>
  </div></div>
  <!-- 結算 -->
  <div class="overlay" id="result"><div class="card" id="resultCard"></div></div>
  <!-- 圖鑑 -->
  <div class="overlay" id="dex"><div class="card" id="dexCard"></div></div>
</div>

<script>
/* ============ 物品插圖（全部手繪 SVG，viewBox 0 0 64 64） ============ */
const INK = '#2a2620';
const G = (inner, extra='') => `<g stroke="${INK}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${extra}>${inner}</g>`;
// 描邊線條：先畫粗深色，再畫細彩色，做出有輪廓的線
const LINE = (d, color, w=5) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+3}"/><path d="${d}" fill="none" stroke="${color}" stroke-width="${w}"/>`;
const circ = (cx,cy,r) => `M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0z`;
const gear = (cx,cy,r1,r2,n) => { let p=''; for(let i=0;i<n*2;i++){ const r=i%2?r2:r1, a=Math.PI*i/n; p+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1);} return p+'Z'; };
const star = (cx,cy,r1,r2,n,rot=-90) => { let p=''; for(let i=0;i<n*2;i++){ const r=i%2?r2:r1, a=(rot*Math.PI/180)+Math.PI*i/n; p+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1);} return p+'Z'; };
const FOAM = 'url(#foamTex)';
const HL = (d) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>`;

/* ============ 音效 ============ */
let muted = store.get('tideMuted', false);
let actx = null;
function ctx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); return actx; }
function tone(freq,dur=.14,type='triangle',vol=.16,delay=0){
  if(muted) return; const c=ctx(); if(!c) return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur);
}
function whoosh(){
  if(muted) return; const c=ctx(); if(!c) return;
  const len=c.sampleRate*1.3, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);
  const src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  src.buffer=buf; f.type='lowpass'; f.frequency.setValueAtTime(300,c.currentTime); f.frequency.linearRampToValueAtTime(1400,c.currentTime+.6); f.frequency.linearRampToValueAtTime(250,c.currentTime+1.3);
  g.gain.value=.22; src.connect(f).connect(g).connect(c.destination); src.start();
}
const sfx = {
  good(n){ tone(520+Math.min(n,10)*35,.13); if(n>=3&&n%3===0) tone(780+n*20,.16,'triangle',.13,.08); },
  bad(){ tone(170,.22,'sawtooth',.12); },
  dig(){ tone(260,.08,'square',.06); tone(340,.08,'square',.06,.06); },
  snip(){ tone(1200,.05,'square',.07); tone(900,.05,'square',.06,.05); },
  hurt(){ tone(220,.3,'sawtooth',.13); tone(150,.35,'sawtooth',.11,.12); },
  yay(){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.13,i*.09)); }
};

/* ============ 浪 ============ */
const surge = $('#surge');
function runWave(first=false){
  S.waving=true; cancelDrag(); clearSel();
  whoosh();
  surge.style.transition=`height ${T(550)}ms ease-in`;
  surge.style.height='100%';
  setTimeout(()=>{
    if(!first) resolveBeach();
    if(S.hp<=0){ retreat(); setTimeout(()=>finish(false), T(700)); return; }
    if(!first) S.wave++;
    const st=STAGES[S.stage];
    if(S.wave>=st.waves){ retreat(); setTimeout(stageDone, T(800)); return; }
    updateWhere();
    spawnWave();
    retreat();
    setTimeout(()=>{ S.waving=false; S.early=false; S.timeLeft=S.interval; if(st.turtle && st.turtle.includes(S.wave)) spawnTurtle(); }, T(650));
  }, T(580));
}
function retreat(){ surge.style.transition=`height ${T(700)}ms ease-out`; surge.style.height='0'; }

function resolveBeach(){
  let swept=0, hpLoss=0, kept=0;
  S.items.forEach(it=>{
    if(it.def.cat==='natural'){ kept++; unlock(it.def.id); }
    else { swept++; hpLoss += it.def.special==='net' ? 15 : 6; }
    it.el.classList.add('swept'); it.el.style.top='-10%';
    const el=it.el; setTimeout(()=>el.remove(), T(650));
  });
  S.items=[];
  if(S.turtle){ if(!S.turtle.hurt){ S.stats.turtleSafe++; setScore(S.score+80); } S.turtle.el.remove(); S.turtle=null; }
  S.stats.swept+=swept; S.stats.kept+=kept;
  if(kept) setScore(S.score + kept*40);
  if(hpLoss) setHP(S.hp - hpLoss);
  if(swept || kept){
    const parts=[];
    if(swept) parts.push(`浪捲走了 ${swept} 件垃圾，海洋健康 −${hpLoss}`);
    if(kept) parts.push(`${kept} 件自然物留在海裡 +${kept*40}`);
    toast(parts.join('。'), swept?'bad':'good', 2600, swept?'來不及了':'做得好');
    if(swept){ setCombo(0); sfx.bad(); }
  }
}

function drawItem(cat, {noCf, cf, td}={}){
  let pool = ITEMS.filter(i=>i.cat===cat && !i.special);
  const f = p => p.filter(i=>(!noCf||!i.cf)&&(!cf||i.cf)&&(!td||i.td));
  let cand = f(pool).filter(i=>!S.used.has(i.id));
  if(!cand.length) cand = f(pool);
  if(!cand.length) cand = pool.filter(i=>!S.used.has(i.id));
  if(!cand.length) cand = pool;
  const it = pick(cand); S.used.add(it.id); return it;
}

function spawnWave(){
  const st=STAGES[S.stage], w=S.wave;
  const defs=[];
  const nat = st.natural[w]||0;
  let waste = st.per - nat;
  if(st.net && st.net.includes(w)){ defs.push(ITEM_BY_ID.ghost_net); waste--; }
  if(st.turtle && st.turtle.includes(w)){
    for(let k=0;k<2;k++){ defs.push(drawItem(pick(['plastic','fishing','other'].filter(c=>st.cats.includes(c))), {td:true})); waste--; }
  }
  if(st.cf){
    for(let k=0;k<st.cf && waste>0;k++){ const c=pick(st.cats.filter(c=>ITEMS.some(i=>i.cat===c&&i.cf&&!S.used.has(i.id)))||st.cats); if(c){ defs.push(drawItem(c,{cf:true})); waste--; } }
  }
  let catCycle = shuffle(st.cats);
  for(let k=0;k<waste;k++) defs.push(drawItem(catCycle[k%catCycle.length], {noCf:st.noCf}));
  for(let k=0;k<nat;k++) defs.push(drawItem('natural'));

  measure();
  const pts=[];
  shuffle(defs).forEach(def=>{
    const big = def.special==='net';
    const buried = !big && st.buried && Math.random()<st.buried;
    const p = findSpot(pts, big);
    pts.push(p);
    const it = {uid:'u'+(++uidSeq), def, fx:p.x, fy:p.y, buried, cuts: big?3:0};
    S.items.push(it);
    it.el = makeItemEl(it);
    it.el.classList.add('arrive');
    it.el.style.animationDelay = (REDUCED?0:Math.random()*220)+'ms';
    itemsLayer.appendChild(it.el);
  });
}

function measure(){ const r=field.getBoundingClientRect(); fw=r.width; fh=r.height; }
function findSpot(pts, big){
  const minD = big?105:84; let best=null, bestD=-1;
  for(let t=0;t<60;t++){
    const x=rand(.13,.87), y=rand(.37,.86);
    let d=Infinity; pts.forEach(p=>{ d=Math.min(d, Math.hypot((p.x-x)*fw,(p.y-y)*fh)); });
    if(d>=minD) return {x,y};
    if(d>bestD){ bestD=d; best={x,y}; }
  }
  return best;
}

function itemInner(it){
  if(it.buried) return `<span class="art">${MOUND_SVG}</span><span class="tag">點一下挖開</span>`;
  let tag = it.def.name;
  if(it.def.special==='net') tag = it.cuts>0 ? `點 ${it.cuts} 下剪開` : '漁網（已剪開）';
  return `<span class="art">${iconSvg(it.def.id)}</span><span class="tag">${tag}</span>`;
}
function makeItemEl(it){
  const el=document.createElement('button');
  el.className='item'+(it.buried?' buried':'')+(it.def.special==='net'?' big':'');
  el.dataset.uid=it.uid;
  el.setAttribute('aria-label', it.buried?'埋在沙裡的東西，點一下挖開':it.def.name);
  el.style.left=(it.fx*100)+'%'; el.style.top=(it.fy*100)+'%';
  el.innerHTML=itemInner(it);
  return el;
}
const byUid = uid => S.items.find(i=>i.uid===uid);

/* ============ 操作：點擊、拖曳 ============ */
function tapItem(it){
  if(S.waving||S.paused||!S.running) return;
  if(it.buried){
    it.buried=false; it.el.classList.remove('buried'); it.el.innerHTML=itemInner(it);
    it.el.setAttribute('aria-label', it.def.name);
    it.el.classList.remove('dig'); void it.el.offsetWidth; it.el.classList.add('dig'); sfx.dig();
    return;
  }
  if(it.def.special==='net' && it.cuts>0){
    it.cuts--; it.el.innerHTML=itemInner(it); sfx.snip();
    it.el.classList.remove('snip'); void it.el.offsetWidth; it.el.classList.add('snip');
    if(it.cuts===0){ it.el.classList.add('cut'); toast('剪開了！現在可以拖進桶子。','good',1800); }
    return;
  }
  if(S.sel===it){ clearSel(); return; }
  clearSel(); S.sel=it; it.el.classList.add('selected');
  binsEl.querySelectorAll('.bin').forEach(b=>b.classList.add('ready'));
}
function clearSel(){ if(S&&S.sel){ S.sel.el.classList.remove('selected'); S.sel=null; } binsEl.querySelectorAll('.bin').forEach(b=>b.classList.remove('ready')); }
const canDrag = it => !it.buried && !(it.def.special==='net' && it.cuts>0);

itemsLayer.addEventListener('pointerdown', e=>{
  const el=e.target.closest('.item'); if(!el||!S||S.waving||S.paused) return;
  const it=byUid(el.dataset.uid); if(!it) return;
  e.preventDefault(); ctx();
  drag={it, el, sx:e.clientX, sy:e.clientY, moved:false, ghost:null, ox:0, oy:0};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
});
window.addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 7 || !canDrag(drag.it)) return;
    drag.moved=true; clearSel();
    const r=drag.el.getBoundingClientRect();
    const g=drag.el.cloneNode(true); g.className='item ghost'+(drag.it.def.special==='net'?' big cut':'');
    g.style.left=r.left+'px'; g.style.top=r.top+'px'; g.style.width=r.width+'px';
    document.body.appendChild(g);
    drag.ghost=g; drag.ox=drag.sx-r.left; drag.oy=drag.sy-r.top;
    drag.el.classList.add('lifted');
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+'px'; drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  const bin=binAt(e.clientX,e.clientY);
  binsEl.querySelectorAll('.bin').forEach(b=>b.classList.toggle('hover', b===bin));
});
window.addEventListener('pointerup', e=>{
  if(!drag) return;
  const d=drag; drag=null;
  binsEl.querySelectorAll('.bin').forEach(b=>b.classList.remove('hover'));
  if(!d.moved){ tapItem(d.it); return; }
  if(S.waving){ d.ghost.remove(); d.el.classList.remove('lifted'); return; }
  const bin=binAt(e.clientX,e.clientY);
  if(bin){ sendToBin(d.it, bin.dataset.cat, d.ghost); return; }
  const r=field.getBoundingClientRect();
  const cx=e.clientX-d.ox+d.ghost.offsetWidth/2, cy=e.clientY-d.oy+d.ghost.offsetHeight/2;
  if(cx>r.left && cx<r.right && cy>r.top && cy<r.bottom){
    d.it.fx=Math.min(.92,Math.max(.08,(cx-r.left)/r.width));
    d.it.fy=Math.min(.9,Math.max(.3,(cy-r.top)/r.height));
    d.el.style.transition='none'; d.el.style.left=(d.it.fx*100)+'%'; d.el.style.top=(d.it.fy*100)+'%';
    void d.el.offsetWidth; d.el.style.transition='';
    d.ghost.remove(); d.el.classList.remove('lifted');
  } else flyBack(d.it, d.ghost);
});
window.addEventListener('pointercancel', cancelDrag);
itemsLayer.addEventListener('click', e=>{ // 鍵盤操作
  if(e.detail!==0) return; const el=e.target.closest('.item'); if(!el) return;
  const it=byUid(el.dataset.uid); if(it) tapItem(it);
});
function cancelDrag(){ if(!drag) return; if(drag.ghost) drag.ghost.remove(); drag.el.classList.remove('lifted'); drag=null; binsEl.querySelectorAll('.bin').forEach(b=>b.classList.remove('hover')); }
function binAt(x,y){
  for(const b of binsEl.querySelectorAll('.bin')){ const r=b.getBoundingClientRect(); if(x>=r.left-4&&x<=r.right+4&&y>=r.top-14&&y<=r.bottom+6) return b; }
  return null;
}
binsEl.addEventListener('click', e=>{
  const b=e.target.closest('.bin'); if(!b||!S||S.waving||S.paused) return;
  ctx();
  if(!S.sel){ toast('先點沙灘上的東西，再點桶子。','info',1600); return; }
  const it=S.sel; clearSel(); sendToBin(it, b.dataset.cat, null);
});

function ghostFor(it){
  const r=it.el.getBoundingClientRect();
  const g=it.el.cloneNode(true); g.className='item ghost'+(it.def.special==='net'?' big cut':'');
  g.style.left=r.left+'px'; g.style.top=r.top+'px'; g.style.width=r.width+'px';
  document.body.appendChild(g); it.el.classList.add('lifted'); return g;
}
function flyBack(it, g){
  const gr=g.getBoundingClientRect(), r=it.el.getBoundingClientRect();
  const a=g.animate([{transform:'translate(0,0)'},{transform:`translate(${r.left-gr.left}px,${r.top-gr.top}px)`}],{duration:T(260),easing:'ease-out'});
  a.onfinish=()=>{ g.remove(); it.el.classList.remove('lifted'); };
}
function popAt(el, text, sub='', minus=false){
  const r=el.getBoundingClientRect(), p=document.createElement('div');
  p.className='pop'+(minus?' minus':''); p.style.left=(r.left+r.width/2)+'px'; p.style.top=(r.top)+'px';
  p.innerHTML=text+(sub?`<small>${sub}</small>`:''); document.body.appendChild(p); setTimeout(()=>p.remove(),850);
}

function sendToBin(it, cat, g){
  if(!S.items.includes(it)){ if(g) g.remove(); return; }
  g = g || ghostFor(it);
  const bin = binsEl.querySelector(`.bin[data-cat="${cat}"]`);
  const def = it.def;
  if(def.cat==='natural'){
    S.stats.natBinned++; setCombo(0); setScore(S.score-40); setHP(S.hp-4); sfx.bad();
    bin.classList.remove('nope'); void bin.offsetWidth; bin.classList.add('nope');
    popAt(bin,'−40','',true);
    toast(`${def.name}是自然物，不用撿。${def.fact}`,'bad',3200,'放回沙灘');
    flyBack(it,g); if(S.hp<=0) endByHP(); return;
  }
  if(def.cat===cat){
    const gr=g.getBoundingClientRect(), br=bin.getBoundingClientRect();
    const dx=br.left+br.width/2-(gr.left+gr.width/2), dy=br.top+br.height/3-(gr.top+gr.height/2);
    const a=g.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.2)`,opacity:.3}],{duration:T(280),easing:'ease-in'});
    a.onfinish=()=>g.remove();
    removeItem(it);
    setCombo(S.combo+1);
    const pts = (def.special==='net'?200:100) + Math.min(S.combo-1,9)*15;
    setScore(S.score+pts); S.stats.correct++; S.stats.byCat[cat]++;
    unlock(def.id); sfx.good(S.combo);
    setTimeout(()=>{ bin.classList.remove('bump'); void bin.offsetWidth; bin.classList.add('bump'); popAt(bin,'+'+pts, S.combo>=2?`連續 ${S.combo}`:''); }, T(200));
    if(def.cf && !S.seenCf.has(def.id)){ S.seenCf.add(def.id); toast(def.why,'good',3200,'答對了，這個很容易搞混'); }
    checkEarly();
  } else {
    S.stats.wrong++; setCombo(0); setScore(S.score-20); sfx.bad();
    bin.classList.remove('nope'); void bin.offsetWidth; bin.classList.add('nope');
    popAt(bin,'−20','',true);
    const msg = def.why ? def.why : `${def.name}要放「${CATS[def.cat].name}」桶。${def.fact}`;
    if(def.cf) S.seenCf.add(def.id);
    toast(msg,'bad',3400,`不是${CATS[cat].name}`);
    flyBack(it,g);
  }
}
function removeItem(it){ S.items=S.items.filter(x=>x!==it); it.el.remove(); if(S.sel===it) clearSel(); }

function checkEarly(){
  if(S.waving||S.early) return;
  const wasteLeft = S.items.some(i=>i.def.cat!=='natural');
  if(wasteLeft) return;
  S.early=true;
  const secs=Math.ceil(S.timeLeft), bonus=secs*10;
  setScore(S.score+bonus);
  setTimeout(()=>toast(`垃圾都清完了，提早 ${secs} 秒 +${bonus}`,'good',1800,'乾淨！'), T(250));
  S.timeLeft=Math.min(S.timeLeft, 1.1);
}

/* ============ 海龜 ============ */
function spawnTurtle(){
  const el=document.createElement('div'); el.className='turtle';
  el.innerHTML=`<div class="wiggle">${TURTLE_SVG}</div>`;
  itemsLayer.appendChild(el);
  S.turtle={el, x0:rand(.25,.75), t:0, dur:S.interval*.82, hurt:false, hazard:{}};
  toast('海龜要回到海裡，清掉牠路上的危險垃圾！','info',2400,'有海龜');
}
function updateTurtle(dt){
  const tu=S.turtle; if(!tu) return;
  tu.t+=dt; const p=Math.min(1,tu.t/tu.dur);
  const seaFrac=parseFloat(field.style.getPropertyValue('--sea-h'))/100||.17;
  const fy=.97-(.97-seaFrac)*p, fx=tu.x0+Math.sin(p*Math.PI*2)*.05;
  tu.el.style.left=(fx*100)+'%'; tu.el.style.top=(fy*100)+'%';
  const tx=fx*fw, ty=fy*fh;
  S.items.forEach(it=>{
    if(!it.def.td || it.buried){ return; }
    const d=Math.hypot(it.fx*fw-tx, it.fy*fh-ty);
    it.el.classList.toggle('danger', d<125);
    if(d<46){
      tu.hazard[it.uid]=(tu.hazard[it.uid]||0)+dt;
      if(tu.hazard[it.uid]>.6) eaten(it);
    }
  });
  if(p>=1){
    S.items.forEach(it=>it.el.classList.remove('danger'));
    if(!tu.hurt){ setScore(S.score+80); S.stats.turtleSafe++; toast('海龜平安回到海裡 +80','good',2000,'太好了'); sfx.yay(); }
    tu.el.remove(); S.turtle=null;
  }
}
function eaten(it){
  const tu=S.turtle; tu.hurt=true; tu.el.classList.add('hurt');
  const a=it.el.animate([{opacity:1,transform:'translate(-50%,-50%) scale(1)'},{opacity:0,transform:'translate(-50%,-50%) scale(.2)'}],{duration:T(300)});
  S.items=S.items.filter(x=>x!==it); if(S.sel===it) clearSel();
  a.onfinish=()=>it.el.remove();
  const loss = it.def.special==='net'?18:12;
  setHP(S.hp-loss); setCombo(0); S.stats.turtleHurt++; sfx.hurt();
  toast(`海龜被${it.def.name}${it.def.cat==='fishing'||it.def.id==='six_ring'||it.def.id==='mask'?'纏住':'誤食'}了，海洋健康 −${loss}。${it.def.fact}`,'bad',3400,'海龜受傷了');
  if(S.hp<=0) endByHP(); else checkEarly();
}

/* ============ 主迴圈 ============ */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S && S.running && !S.paused && !S.waving){
    measure();
    S.timeLeft-=dt;
    setTide(Math.max(0,S.timeLeft/S.interval));
    updateTurtle(dt);
    if(S.timeLeft<=0 && S.hp>0) runWave(false);
  }
  requestAnimationFrame(loop);
}
function setTide(frac){
  $('#tideFill').style.width=(frac*100)+'%';
  $('#tideNum').textContent = S&&S.running ? Math.ceil(Math.max(0,S.timeLeft))+' 秒' : '';
  field.style.setProperty('--sea-h', (17+10*(1-frac))+'%');
}

/* ============ 結束 ============ */
function endByHP(){ if(!S.running) return; S.running=false; cancelDrag(); setTimeout(()=>finish(false), T(700)); }
function stageDone(){
  S.running=false;
  if(S.stage>=STAGES.length-1){ finish(true); return; }
  const bonus=Math.round(S.hp)*2; setScore(S.score+bonus); sfx.yay();
  openCard('intro', `<h2>${STAGES[S.stage].name}結束</h2><p class="sub">海洋健康 ${Math.round(S.hp)}，加 ${bonus} 分。</p>` + INTRO[S.stage+1]() + `<div class="actions"><button class="btn primary" id="goBtn">開始${STAGES[S.stage+1].name}</button></div>`);
  const next=S.stage+1;
  $('#goBtn').onclick=()=>{ closeCard('intro'); S.stage=next; S.wave=0; S.interval=STAGES[next].interval; S.timeLeft=S.interval; renderBins(); updateWhere(); S.running=true; runWave(true); };
  $('#goBtn').focus();
}
function finish(cleared){
  S.running=false; cancelDrag();
  if(S.turtle){ S.turtle.el.remove(); S.turtle=null; }
  if(cleared){ const b=Math.round(S.hp)*10; setScore(S.score+b); S.hpBonus=b; }
  const best=store.get('tideBest',0), isNew=S.score>best; if(isNew) store.set('tideBest',S.score);
  const st=S.stats, total=st.correct;
  const wasteCats=CAT_ORDER.filter(c=>c!=='natural');
  const maxN=Math.max(1,...wasteCats.map(c=>st.byCat[c]));
  const topCat=wasteCats.reduce((a,c)=>st.byCat[c]>st.byCat[a]?c:a, wasteCats[0]);
  const bars=wasteCats.map(c=>`<div class="ln"><span>${CATS[c].name}</span><div><i style="width:${st.byCat[c]/maxN*100}%;background:${CATS[c].color}"></i></div><em>${st.byCat[c]}</em></div>`).join('');
  const line = total ? `你清出 ${total} 件垃圾，最多的是${CATS[topCat].name}類（${st.byCat[topCat]} 件）。` : '這次還沒清到垃圾，再試一次吧。';
  const lesson = st.natBinned ? '有自然物被丟進桶子了。淨灘時，貝殼、海藻、浮木這些留在原地就好。'
    : st.turtleHurt ? '海龜受傷了。塑膠袋、釣線和漁繩對海龜最危險，看到要優先撿。'
    : st.swept>3 ? '有不少垃圾被浪捲回海裡。真實的海岸也是這樣：垃圾留在沙灘上越久，越可能再回到海中。'
    : '做得很好！減少一次性用品，就是讓沙灘少一點垃圾最直接的方法。';
  sfx[cleared?'yay':'hurt']();
  openCard('result', `<h2>${cleared?'淨灘完成':'海洋撐不住了'}</h2>
    <p class="sub">${cleared?`三潮都守住了，剩餘健康 ${Math.round(S.hp)}，加 ${S.hpBonus} 分。`:`在${STAGES[S.stage].name}第 ${Math.min(S.wave+1,STAGES[S.stage].waves)} 波時，海洋健康歸零。`}</p>
    <div class="big-score">${S.score}</div>
    <div class="best ${isNew?'new':''}">${isNew?'新紀錄！':'最佳紀錄 '+best+' 分'}</div>
    <div class="stats">
      <div><b>${st.correct}</b><span>分類正確</span></div>
      <div><b>${st.wrong}</b><span>分錯</span></div>
      <div><b>${S.maxCombo}</b><span>最高連續</span></div>
      <div><b>${st.swept}</b><span>被浪捲走</span></div>
      <div><b>${st.kept}</b><span>保留自然物</span></div>
      <div><b>${st.turtleSafe+st.turtleHurt?st.turtleSafe+'/'+(st.turtleSafe+st.turtleHurt):'—'}</b><span>海龜平安</span></div>
    </div>
    <p>${line}</p>
    <div class="breakdown">${bars}</div>
    <div class="note">${lesson}</div>
    ${S.newCards.length?`<p class="sub">圖鑑新增 ${S.newCards.length} 張，目前 ${dex.size}/${ITEMS.length}。</p>`:''}
    <div class="actions"><button class="btn primary" id="againBtn">再玩一次</button><button class="btn" id="resDexBtn">看圖鑑</button><button class="btn" id="homeBtn">回首頁</button></div>`);
  $('#againBtn').onclick=()=>{ closeCard('result'); newGame(); };
  $('#resDexBtn').onclick=()=>{ openDex(); };
  $('#homeBtn').onclick=()=>{ closeCard('result'); goHome(); };
  $('#againBtn').focus();
}
function goHome(){ if(S){ S.running=false; } cancelDrag(); itemsLayer.innerHTML=''; updateDexCount(); showScreen('start'); }

/* ============ 提示 ============ */
function toast(msg, type='info', ms=2600, title=''){
  const t=$('#toast'); t.className=type; t.innerHTML=(title?`<b>${title}</b>`:'')+msg;
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms);
}

/* ============ 暫停 ============ */
function pauseGame(){ if(!S||!S.running||S.paused) return; S.paused=true; cancelDrag(); $('#pause').classList.add('on'); $('#resumeBtn').focus(); }
function resumeGame(){ if(!S) return; S.paused=false; $('#pause').classList.remove('on'); last=performance.now(); }
$('#pauseBtn').onclick=pauseGame;
$('#resumeBtn').onclick=resumeGame;
$('#quitBtn').onclick=()=>{ $('#pause').classList.remove('on'); S.paused=false; goHome(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
$('#muteBtn').onclick=()=>{ muted=!muted; store.set('tideMuted',muted); renderMute(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#dex').classList.contains('on')) closeCard('dex'); else if(S&&S.paused) resumeGame(); else pauseGame(); }
  if(S&&S.running&&!S.paused&&S.sel&&/^[1-6]$/.test(e.key)){ const b=binsEl.querySelectorAll('.bin')[+e.key-1]; if(b) b.click(); }
});

/* ============ 圖鑑畫面 ============ */
function openDex(focusId){
  const secs = CAT_ORDER.map(c=>{
    const list=ITEMS.filter(i=>i.cat===c);
    return `<div class="dex-sec"><h3><i style="background:${CATS[c].color}"></i>${CATS[c].full}<small style="font-family:var(--body);font-size:.75rem;color:var(--muted)">${list.filter(i=>dex.has(i.id)).length}/${list.length}</small></h3>
    <div class="dex-grid">${list.map(i=>{ const on=dex.has(i.id); return `<button class="dex-card ${on?'':'locked'}" data-id="${i.id}" aria-label="${on?i.name:'尚未收集'}"><span class="art">${iconSvg(i.id)}</span><span>${on?i.name:'？？？'}</span></button>`; }).join('')}</div></div>`;
  }).join('');
  openCard('dex', `<div class="dex-head"><h2>圖鑑</h2><span class="sub">${dex.size}/${ITEMS.length}</span></div>
    <p class="sub">正確分類一種垃圾，或讓自然物留在沙灘上，就會收進圖鑑。</p>
    <div id="dexDetail"></div>${secs}
    <div class="actions"><button class="btn" id="dexClose">關閉</button></div>`);
  $('#dexClose').onclick=()=>closeCard('dex');
  $('#dexCard').querySelectorAll('.dex-card').forEach(b=>b.onclick=()=>{
    const i=ITEM_BY_ID[b.dataset.id];
    const on=dex.has(i.id);
    $('#dexDetail').innerHTML = on
      ? `<div class="note dex-detail"><span class="art">${iconSvg(i.id)}</span><div><b style="font-family:var(--round);font-weight:400;font-size:1.2rem">${i.name}</b><br><small>${CATS[i.cat].full}</small><p style="margin:6px 0 0">${i.fact}</p>${i.why?`<p style="margin:6px 0 0;color:var(--muted)">${i.why}</p>`:''}</div></div>`
      : `<div class="note">這張還沒收集到。在遊戲中${i.cat==='natural'?'讓它留在沙灘上':'把它分進正確的桶子'}就能解鎖。</div>`;
    $('#dexCard').scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
  });
  $('#dexClose').focus();
}

/* ============ 初始化 ============ */
document.body.insertAdjacentHTML('afterbegin', GLOBAL_DEFS);
$('#seaEdge').innerHTML=WAVE_EDGE('#3e9ca0');
$('#surgeEdge').innerHTML=WAVE_EDGE('rgba(127,207,201,.8)');
$('#startFoam').innerHTML=WAVE_EDGE('#3e9ca0');
$('#rp1').innerHTML=iconSvg('drink_cup');
$('#rp2').innerHTML=iconSvg('shell');
$('#rp3').innerHTML=TURTLE_SVG;
$('#startBtn').onclick=()=>{ ctx(); newGame(); };
$('#dexBtn').onclick=()=>openDex();
renderMute(); updateDexCount();
window.addEventListener('resize', measure);
requestAnimationFrame(loop);

/* ============ PWA：離線快取與安裝 ============ */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('#installBtn').hidden=false; });
$('#installBtn').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(_){} installEvt=null; $('#installBtn').hidden=true; };
window.addEventListener('appinstalled',()=>{ $('#installBtn').hidden=true; });
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
if(isIOS && !standalone) $('#iosTip').hidden=false;
</script>
